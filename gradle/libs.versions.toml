[versions]
agp = "9.1.0"
xposed-api = "82"
androidx-annotation = "1.9.1"
androidx-appcompat = "1.7.1"
androidx-activity = "1.13.0"
androidx-constraintlayout = "2.2.1"
androidx-preference = "1.2.1"
google-material = "1.13.0"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
#espresso-core = "3.7.0"

[libraries]
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed-api" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "androidx-preference" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
#espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

